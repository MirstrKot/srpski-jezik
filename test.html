<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Srpski jezik — test padeža</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 780px;
    margin: 40px auto;
    padding: 0 24px 60px;
    background: #f8f7f4;
    color: #1a1a1a;
    line-height: 1.9;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: normal;
    border-bottom: 2px solid #d0cdc7;
    padding-bottom: 10px;
    margin-bottom: 6px;
    color: #222;
    letter-spacing: 0.02em;
  }

  #progress {
    font-size: 0.82rem;
    color: #999;
    margin-bottom: 24px;
  }

  #quiz-container {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .q-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 3px;
    margin: 10px 0;
    padding: 6px 0;
    border-bottom: 1px solid #ebe9e4;
  }

  .q-num {
    min-width: 26px;
    font-size: 0.8rem;
    color: #bbb;
    flex-shrink: 0;
    padding-top: 1px;
  }

  .q-part { white-space: pre-wrap; }

  .answer-input {
    border: none;
    border-bottom: 2px solid #b0aaa0;
    background: transparent;
    font-size: 1rem;
    font-family: inherit;
    color: #111;
    padding: 0 3px 1px;
    outline: none;
    min-width: 52px;
    transition: border-color 0.15s;
    vertical-align: baseline;
  }

  .answer-input:focus { border-bottom-color: #555; }

  .answer-input.correct {
    border-bottom-color: #43a047;
    color: #2e7d32;
    background: #f0faf0;
    border-radius: 3px 3px 0 0;
  }

  .answer-input.wrong {
    border-bottom-color: #e53935;
    color: #b71c1c;
    background: #fff5f5;
    border-radius: 3px 3px 0 0;
  }

  .tip-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    flex-shrink: 0;
    margin-left: 6px;
  }

  .tip-btn {
    display: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e53935;
    color: #fff;
    font-size: 0.72rem;
    font-weight: bold;
    border: none;
    cursor: default;
    position: relative;
    line-height: 20px;
    text-align: center;
    padding: 0;
    flex-shrink: 0;
  }

  .tip-btn.show { display: inline-block; }

  .tip-btn:hover::after {
    content: attr(data-tip);
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    background: #222;
    color: #fff;
    padding: 5px 11px;
    border-radius: 5px;
    font-size: 0.88rem;
    font-family: Georgia, serif;
    white-space: nowrap;
    z-index: 200;
    pointer-events: none;
  }

  .tip-btn:hover::before {
    content: '';
    position: absolute;
    left: 21px;
    top: 50%;
    transform: translateY(-50%);
    border: 5px solid transparent;
    border-right-color: #222;
    z-index: 200;
    pointer-events: none;
  }

  #footer {
    margin-top: 32px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  #action-btn {
    padding: 10px 26px;
    background: #3d5a80;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.97rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }

  #action-btn:hover:not(:disabled) { background: #2c4770; }
  #action-btn:disabled { background: #aaa; cursor: default; }

  #clear-btn {
    padding: 10px 18px;
    background: transparent;
    color: #aaa;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    display: none;
    transition: color 0.15s, border-color 0.15s;
  }

  #clear-btn:hover { color: #e53935; border-color: #e53935; }

  #done-msg {
    display: none;
    padding: 22px 28px;
    background: #e8f5e9;
    border-radius: 8px;
    color: #2e7d32;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }

  /* ===== EASTER EGG ===== */

  #egg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 20, 0.92);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: eggFadeIn 0.6s ease forwards;
  }

  @keyframes eggFadeIn { to { opacity: 1; } }

  #fw-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #diploma {
    position: relative;
    z-index: 2;
    transform: scale(0.1) rotate(-8deg);
    opacity: 0;
    animation: diplomaPop 0.7s 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes diplomaPop {
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .dip-outer {
    background: #fdf6e3;
    border: 4px double #b8960c;
    padding: 6px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px #e6c84a, 0 30px 80px rgba(0,0,0,0.7), inset 0 0 40px rgba(200,160,0,0.06);
  }

  .dip-inner {
    border: 1px solid #d4a50a;
    padding: 32px 44px 28px;
    text-align: center;
    min-width: 360px;
    max-width: 480px;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 40px,
      rgba(200,160,0,0.03) 40px,
      rgba(200,160,0,0.03) 41px
    );
  }

  .dip-ornament {
    color: #c9a227;
    font-size: 1rem;
    letter-spacing: 10px;
    margin-bottom: 6px;
    opacity: 0.7;
  }

  .dip-title {
    font-size: 1.9rem;
    letter-spacing: 14px;
    color: #4a2c00;
    font-weight: normal;
    margin: 0 0 4px;
    font-family: Georgia, serif;
    text-shadow: 1px 1px 0 rgba(200,160,0,0.3);
  }

  .dip-rule {
    border: none;
    border-top: 1px solid #d4a50a;
    margin: 10px auto;
    width: 80%;
    opacity: 0.5;
  }

  .dip-confirms {
    font-size: 0.78rem;
    color: #888;
    font-style: italic;
    margin: 8px 0 14px;
    letter-spacing: 0.04em;
  }

  .dip-rank {
    font-size: 1.55rem;
    color: #7a1010;
    font-family: Georgia, serif;
    margin: 4px 0 12px;
    line-height: 1.3;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
  }

  .dip-stats {
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 18px;
    line-height: 1.6;
  }

  .dip-stats strong { color: #666; }

  /* kolo dance — figures bob up/down alternately */
  .kolo {
    display: flex;
    justify-content: center;
    gap: 2px;
    font-size: 1.55rem;
    margin: 14px 0 10px;
    line-height: 1;
  }

  .kolo span { display: inline-block; animation: koloBob 0.45s ease-in-out infinite alternate; }
  .kolo span:nth-child(even) { animation-direction: alternate-reverse; }
  .kolo span:nth-child(3n)   { animation-duration: 0.55s; }

  @keyframes koloBob {
    from { transform: translateY(0) scaleX(1); }
    to   { transform: translateY(-7px) scaleX(0.95); }
  }

  .dip-quote {
    font-size: 1.05rem;
    color: #4a2c00;
    font-style: italic;
    margin: 6px 0 18px;
    letter-spacing: 0.03em;
  }

  .dip-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
  }

  .dip-seal {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #e6c84a, #8b6514);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    animation: sealSpin 8s linear infinite;
  }

  @keyframes sealSpin {
    from { filter: hue-rotate(0deg); }
    to   { filter: hue-rotate(40deg); }
  }

  .dip-date {
    font-size: 0.75rem;
    color: #aaa;
    text-align: right;
    line-height: 1.5;
  }

  .dip-close {
    display: block;
    margin: 20px auto 0;
    padding: 9px 28px;
    background: #3d5a80;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    transition: background 0.15s;
  }

  .dip-close:hover { background: #2c4770; }

  /* Corner ornaments */
  .dip-inner::before,
  .dip-inner::after {
    content: '✦';
    display: block;
    color: #d4a50a;
    font-size: 0.85rem;
    opacity: 0.6;
  }
  .dip-inner::after { margin-top: 16px; }
</style>
</head>
<body>

<h1>Srpski jezik — test padeža</h1>
<div id="progress"></div>
<ol id="quiz-container"></ol>
<div id="done-msg">Odlično! Tačno ste odgovorili na sva pitanja. Možete obrisati istoriju da počnete iznova.</div>

<div id="footer">
  <button id="action-btn">Proveri rezultate</button>
  <button id="clear-btn">Obriši istoriju</button>
</div>

<script src="questions.js"></script>
<script>
(function () {
  const STORAGE_KEY   = 'srpski_correct_ids';
  const ROUNDS_KEY    = 'srpski_rounds';
  const BATCH = 10;

  let currentBatch = [];
  let checked = false;

  function getCorrect() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function markCorrect(id) {
    const ids = getCorrect();
    if (!ids.includes(id)) { ids.push(id); localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); }
  }

  function getRounds() {
    return parseInt(localStorage.getItem(ROUNDS_KEY) || '0');
  }

  function incRounds() {
    localStorage.setItem(ROUNDS_KEY, getRounds() + 1);
  }

  function clearHistory() {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(ROUNDS_KEY);
  }

  function available() {
    const done = getCorrect();
    return QUESTIONS.filter(q => !done.includes(q.id));
  }

  function pickRandom(arr, n) {
    return [...arr].sort(() => Math.random() - 0.5).slice(0, n);
  }

  function sizeInput(input) {
    const len = Math.max((input.value || input.placeholder).length, 4);
    input.style.width = (len * 0.62 + 0.8) + 'em';
  }

  function renderBatch(batch) {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    batch.forEach((q, idx) => {
      const li = document.createElement('li');
      li.className = 'q-row';
      li.dataset.qid = q.id;

      const num = document.createElement('span');
      num.className = 'q-num';
      num.textContent = (idx + 1) + '.';
      li.appendChild(num);

      const parts = q.sentence.split('___');
      const inputs = [];

      parts.forEach((part, i) => {
        if (part) {
          const sp = document.createElement('span');
          sp.className = 'q-part';
          sp.textContent = part;
          li.appendChild(sp);
        }
        if (i < parts.length - 1) {
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'answer-input';
          inp.placeholder = q.placeholders[i] || '';
          inp.autocomplete = 'off';
          inp.autocorrect = 'off';
          inp.spellcheck = false;
          sizeInput(inp);
          inp.addEventListener('input', () => sizeInput(inp));
          inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const all = Array.from(document.querySelectorAll('.answer-input:not(:disabled)'));
              const next = all[all.indexOf(inp) + 1];
              if (next) next.focus(); else document.getElementById('action-btn').click();
            }
          });
          inputs.push(inp);
          li.appendChild(inp);
        }
      });

      const slot = document.createElement('span');
      slot.className = 'tip-slot';
      const tipBtn = document.createElement('button');
      tipBtn.className = 'tip-btn';
      tipBtn.textContent = '?';
      tipBtn.type = 'button';
      slot.appendChild(tipBtn);
      li.appendChild(slot);

      li._inputs = inputs;
      li._tipBtn = tipBtn;
      container.appendChild(li);
    });

    const first = container.querySelector('.answer-input');
    if (first) first.focus();
  }

  function checkAnswers() {
    checked = true;
    incRounds();
    const rows = document.querySelectorAll('.q-row');

    rows.forEach(row => {
      const id = parseInt(row.dataset.qid);
      const q = QUESTIONS.find(x => x.id === id);
      const inputs = row._inputs;
      let allOk = true;
      const wrong = [];

      inputs.forEach((inp, i) => {
        const user = inp.value.trim().toLowerCase();
        const correct = q.answers[i].toLowerCase();
        inp.disabled = true;
        if (user === correct) {
          inp.classList.add('correct');
        } else {
          inp.classList.add('wrong');
          allOk = false;
          wrong.push(q.answers[i]);
        }
      });

      if (allOk) {
        markCorrect(id);
      } else {
        row._tipBtn.setAttribute('data-tip', wrong.join(' / '));
        row._tipBtn.classList.add('show');
      }
    });

    updateUI(true);
  }

  function loadBatch() {
    checked = false;
    const pool = available();
    updateProgress();
    updateClearBtn();

    const doneMsg  = document.getElementById('done-msg');
    const actionBtn = document.getElementById('action-btn');

    if (pool.length === 0) {
      document.getElementById('quiz-container').innerHTML = '';
      doneMsg.style.display = 'none';
      actionBtn.style.display = 'none';
      updateClearBtn();
      showEasterEgg();
      return;
    }

    doneMsg.style.display = 'none';
    actionBtn.style.display = 'inline-block';
    actionBtn.textContent = 'Proveri rezultate';
    actionBtn.disabled = false;

    currentBatch = pickRandom(pool, Math.min(BATCH, pool.length));
    renderBatch(currentBatch);
  }

  function updateUI(afterCheck) {
    const pool = available();
    const actionBtn = document.getElementById('action-btn');
    updateClearBtn();
    updateProgress();
    if (!afterCheck) return;
    if (pool.length === 0) {
      actionBtn.textContent = 'Gotovo!';
      actionBtn.disabled = true;
    } else {
      actionBtn.textContent = 'Još ' + Math.min(BATCH, pool.length) + ' primera';
    }
  }

  function updateProgress() {
    const total = QUESTIONS.length;
    const done = total - available().length;
    const el = document.getElementById('progress');
    el.textContent = done > 0
      ? 'Tačno odgovoreno: ' + done + ' / ' + total
      : 'Ukupno primera: ' + total;
  }

  function updateClearBtn() {
    document.getElementById('clear-btn').style.display =
      getCorrect().length > 0 ? 'inline-block' : 'none';
  }

  // ===== EASTER EGG =====

  function showEasterEgg() {
    const rounds = getRounds();
    const total  = QUESTIONS.length;
    const now    = new Date();
    const dateStr = now.toLocaleDateString('sr-Latn', { day: 'numeric', month: 'long', year: 'numeric' });

    const overlay = document.createElement('div');
    overlay.id = 'egg-overlay';

    const canvas = document.createElement('canvas');
    canvas.id = 'fw-canvas';
    overlay.appendChild(canvas);

    overlay.innerHTML += `
      <div id="diploma">
        <div class="dip-outer">
          <div class="dip-inner">
            <div class="dip-ornament">— ✦ —</div>
            <h2 class="dip-title">D I P L O M A</h2>
            <hr class="dip-rule">
            <p class="dip-confirms">Ovim se potvrđuje da je posednik ove diplome</p>
            <div class="dip-rank">Majstor Srpskog Padeža</div>
            <p class="dip-stats">
              Savladano svih <strong>${total} primera</strong> iz svih padeža<br>
              za <strong>${rounds} ${roundWord(rounds)}</strong>
            </p>
            <div class="kolo">
              <span>🕺</span><span>💃</span><span>🕺</span><span>💃</span><span>🕺</span><span>💃</span><span>🕺</span><span>💃</span>
            </div>
            <p class="dip-quote">„Svaka čast!"</p>
            <div class="dip-bottom">
              <div class="dip-seal">✦</div>
              <div class="dip-date">Srpski jezik<br>${dateStr}</div>
            </div>
            <button class="dip-close" id="dip-close-btn">Zatvori</button>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // Re-grab canvas after innerHTML
    const fw = overlay.querySelector('#fw-canvas');
    launchFireworks(fw);

    overlay.querySelector('#dip-close-btn').addEventListener('click', () => {
      overlay.remove();
      document.getElementById('done-msg').style.display = 'block';
      document.getElementById('footer').style.display = 'flex';
      updateClearBtn();
    });
  }

  function roundWord(n) {
    if (n % 10 === 1 && n % 100 !== 11) return 'krug';
    if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'kruga';
    return 'krugova';
  }

  function launchFireworks(canvas) {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    const particles = [];
    const COLORS = [
      '#ff4444','#ff8844','#ffdd00','#aaff44','#44ffaa',
      '#44aaff','#8844ff','#ff44cc','#ffffff','#ffd700'
    ];

    function burst(x, y) {
      const baseColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      const count = 55 + Math.floor(Math.random() * 25);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
        const speed = Math.random() * 5.5 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          color: Math.random() < 0.2 ? COLORS[Math.floor(Math.random() * COLORS.length)] : baseColor,
          alpha: 1,
          radius: Math.random() * 2.8 + 0.8,
          gravity: 0.07 + Math.random() * 0.05,
          flicker: Math.random() < 0.4,
        });
      }
    }

    // Scheduled bursts — avoid the diploma area (center)
    const W = canvas.width, H = canvas.height;
    const schedule = [
      [50,  W * 0.15, H * 0.25],
      [200, W * 0.85, H * 0.20],
      [400, W * 0.08, H * 0.55],
      [600, W * 0.92, H * 0.50],
      [800, W * 0.20, H * 0.15],
      [1000,W * 0.80, H * 0.30],
      [1300,W * 0.10, H * 0.35],
      [1500,W * 0.90, H * 0.65],
    ];
    schedule.forEach(([delay, x, y]) => setTimeout(() => burst(x, y), delay));

    // Ongoing random bursts on the sides
    const interval = setInterval(() => {
      if (!document.getElementById('egg-overlay')) { clearInterval(interval); return; }
      const side = Math.random() < 0.5;
      burst(
        side ? Math.random() * W * 0.25 : W * 0.75 + Math.random() * W * 0.25,
        Math.random() * H * 0.6
      );
    }, 700);

    function animate() {
      if (!document.getElementById('egg-overlay')) return;
      ctx.clearRect(0, 0, W, H);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.985;
        p.alpha -= p.flicker ? 0.013 + Math.random() * 0.008 : 0.013;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();
  }

  // ===== Event listeners =====
  document.getElementById('action-btn').addEventListener('click', () => {
    if (!checked) checkAnswers();
    else loadBatch();
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (confirm('Obrisati svu istoriju tačnih odgovora?')) {
      clearHistory();
      loadBatch();
    }
  });

  loadBatch();
})();
</script>
</body>
</html>
